name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A manual dispatch usually re-runs a push build; only pull requests supersede an
# in-flight run. Otherwise dispatching cancels the very run being verified.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Chaquopy packs native Python wheels during the build and is memory hungry.
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false"
  # No wrapper is committed (its JAR cannot be regenerated here), so every job
  # installs this exact distribution and calls `gradle` directly.
  GRADLE_VERSION: "8.11.1"
  PYTHON_VERSION: "3.10"
  NDK_VERSION: "27.2.12479018"
  CMAKE_VERSION: "3.22.1"

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit tests and Android Lint
    # Pinned: the ubuntu-latest label now resolves to the 26.04 image, which no longer
    # ships the Android SDK; 24.04 keeps the toolchain reproducible.
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # Chaquopy needs a host Python matching the app's bundled interpreter.
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # The runner image does not reliably provide an Android SDK, so install it here:
      # AGP needs platform 35 + build-tools to configure, and the NDK step needs sdkmanager.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0 platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      # Native llama.cpp is not needed to exercise the Kotlin/Python logic.
      - name: Run unit tests and lint
        run: gradle :app:testDebugUnitTest :app:lintDebug -Plucknow.withLlama=false --stacktrace

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
            app/build/test-results/
          if-no-files-found: warn
          retention-days: 14

  python-tests:
    name: Python statistical engine
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install pinned scientific stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r python_tests/requirements.txt

      - name: Verify the on-device analysis module
        run: python python_tests/test_analysis.py

  bdd:
    name: BDD (Cucumber-Android on API 34)
    # Pinned: the ubuntu-latest label now resolves to the 26.04 image, which no longer
    # ships the Android SDK; 24.04 keeps the toolchain reproducible.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      matrix:
        abi: [x86_64]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # The emulator action installs the system image, but Gradle still needs a
      # configured SDK with platform 35 to build the test APK.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0 platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The emulator runs x86_64, so the BDD APK is rebuilt for that ABI only.
      - name: Run Cucumber scenarios
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: ${{ matrix.abi }}
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            set +e
            gradle :app:connectedDebugAndroidTest -PabiFilters=${{ matrix.abi }} -Plucknow.withLlama=false --stacktrace --console=plain
            status=$?
            if [ $status -ne 0 ]; then
              # The HTML report only says "Process crashed", so dump the device log
              # to make instrumentation failures diagnosable from the job log.
              echo "::group::logcat crash buffer"
              adb logcat -d -b crash -v brief | tail -120
              echo "::endgroup::"
              echo "::group::logcat app/webview"
              adb logcat -d -v brief | grep -iE "lucknow|chromium|webview|AndroidRuntime|FATAL|chaquopy" | tail -300
              echo "::endgroup::"
            fi
            exit $status

      - name: Upload BDD reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bdd-reports-${{ matrix.abi }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: warn
          retention-days: 14

  build-apk:
    name: Build APK (${{ matrix.abi }})
    # Deliberately independent of the test jobs: a lint, unit-test or emulator
    # failure must never stop the debug APK from being produced.
    # Pinned: the ubuntu-latest label now resolves to the 26.04 image, which no longer
    # ships the Android SDK; 24.04 keeps the toolchain reproducible.
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      matrix:
        abi: [arm64-v8a, x86_64]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # The NDK step below needs sdkmanager on PATH, and AGP needs platform 35.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0 platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Vendor pinned llama.cpp
        run: bash scripts/fetch-llama-cpp.sh

      - name: Install NDK and CMake
        run: |
          SDKMANAGER="$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            "ndk;${NDK_VERSION}" "cmake;${CMAKE_VERSION}" > /dev/null || true
          test -d "$ANDROID_HOME/ndk/${NDK_VERSION}" \
            || { echo "::error::NDK ${NDK_VERSION} was not installed"; exit 1; }

      - name: Configure release signing
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/lucknow-release.jks"

          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
            {
              echo "LUCKNOW_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD"
              echo "LUCKNOW_KEY_ALIAS=${ANDROID_KEY_ALIAS:-lucknow}"
              echo "LUCKNOW_KEY_PASSWORD=${ANDROID_KEY_PASSWORD:-$ANDROID_KEYSTORE_PASSWORD}"
            } >> "$GITHUB_ENV"
            echo "signing_source=repository secrets" >> "$GITHUB_OUTPUT"
          else
            # No signing secrets: an ephemeral key still yields an installable APK.
            EPHEMERAL_PASSWORD="$(openssl rand -hex 16)"
            keytool -genkeypair -keystore "$KEYSTORE" -storetype PKCS12 -alias lucknow \
              -keyalg RSA -keysize 2048 -validity 3650 \
              -storepass "$EPHEMERAL_PASSWORD" -keypass "$EPHEMERAL_PASSWORD" \
              -dname "CN=Luck Now CI, O=CI, C=US" > /dev/null 2>&1
            {
              echo "LUCKNOW_KEYSTORE_PASSWORD=$EPHEMERAL_PASSWORD"
              echo "LUCKNOW_KEY_ALIAS=lucknow"
              echo "LUCKNOW_KEY_PASSWORD=$EPHEMERAL_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "signing_source=ephemeral CI keystore" >> "$GITHUB_OUTPUT"
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not configured. The release APK uses an ephemeral CI key and must not be published to Play."
          fi

          echo "LUCKNOW_KEYSTORE_PATH=$KEYSTORE" >> "$GITHUB_ENV"

      - name: Build debug APK
        run: |
          set -euo pipefail
          gradle :app:assembleDebug -PabiFilters=${{ matrix.abi }} -Plucknow.withLlama=true --stacktrace
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk "artifacts/app-${{ matrix.abi }}-debug.apk"

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: luck-now-debug-${{ matrix.abi }}
          path: artifacts/app-${{ matrix.abi }}-debug.apk
          if-no-files-found: error
          retention-days: 30

      # Best effort: signing, R8 or resource shrinking problems here must not
      # invalidate the debug APK that was already uploaded above.
      - name: Build release APK
        id: release
        continue-on-error: true
        run: |
          set -euo pipefail
          gradle :app:assembleRelease -PabiFilters=${{ matrix.abi }} -Plucknow.withLlama=true --stacktrace
          mkdir -p artifacts
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk "artifacts/app-${{ matrix.abi }}-release.apk"
          else
            cp app/build/outputs/apk/release/app-release-unsigned.apk "artifacts/app-${{ matrix.abi }}-release.apk"
          fi

      - name: Collect mapping file
        if: always()
        run: |
          mkdir -p artifacts
          cp app/build/outputs/mapping/release/mapping.txt "artifacts/mapping-${{ matrix.abi }}.txt" || true
          ls -lh artifacts

      - name: Verify release APK
        if: always()
        continue-on-error: true
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          APK="artifacts/app-${{ matrix.abi }}-release.apk"
          if [ ! -f "$APK" ]; then
            echo "::warning::release APK was not produced; skipping verification"
            exit 0
          fi
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          AAPT2="$(find "$ANDROID_HOME/build-tools" -name aapt2 -type f | sort -V | tail -1)"
          "$APKSIGNER" verify --verbose "$APK" | head -20
          "$AAPT2" dump badging "$APK" | grep -E "package:|sdkVersion|targetSdkVersion|native-code"
          unzip -l "$APK" | grep -E "liblucknow_llm" \
            || echo "::warning::native llama.cpp runtime not found in the release APK"

      - name: Upload all artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: luck-now-${{ matrix.abi }}
          path: |
            artifacts/app-${{ matrix.abi }}-debug.apk
            artifacts/app-${{ matrix.abi }}-release.apk
            artifacts/mapping-${{ matrix.abi }}.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Summarise artifact
        if: always()
        run: |
          {
            echo "### Luck Now APK — ${{ matrix.abi }}"
            echo ""
            echo "- Debug: \`app-${{ matrix.abi }}-debug.apk\`"
            echo "- Release: \`app-${{ matrix.abi }}-release.apk\` (best effort)"
            echo "- Signing: ${{ steps.signing.outputs.signing_source }}"
            echo "- Debug build: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"

  github-release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-apk
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download APKs (both ABIs)
        uses: actions/download-artifact@v4
        with:
          pattern: luck-now-*
          path: artifacts

      - name: Assemble release bundle
        run: |
          mkdir -p artifacts/final
          cp -r artifacts/luck-now-*/* artifacts/final/ || true
          ls -lh artifacts/final

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/final/app-*-debug.apk
            artifacts/final/app-*-release.apk
            artifacts/final/mapping-*.txt
          generate_release_notes: true
          fail_on_unmatched_files: false
